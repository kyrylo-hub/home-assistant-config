- id: '1790766870261'
  alias: Hall remote -> main light
  description: ''
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: 03210ace0cb26c0dcb05446494dda33b
      command: remote_button_short_press
  conditions: []
  actions:
  - action: light.toggle
    target:
      entity_id: light.hall_switch_hall_main_v2
  mode: single
- id: '1790777311497'
  alias: Velair - Pause a zone while windows are open
  description: ''
  use_blueprint:
    path: cgonfer/window_pause.yaml
    input:
      climate_entity:
      - climate.controller_balcony_7_87_termostat
      opening_entities:
      - binary_sensor.window_balcony_1_hobeian_zg_102z
      - binary_sensor.window_balcony_2
      - binary_sensor.balcony_door_mi_sensor
      pause_action: turn_off
      open_delay:
        hours: 0
        minutes: 0
        seconds: 10
      close_delay:
        hours: 0
        minutes: 0
        seconds: 10
