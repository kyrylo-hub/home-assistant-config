template:
- switch:
  - name: Living Room Boost
    unique_id: living_room_boost_alexa
    state: '{{ is_state(''sensor.spalnia_velair1_controller_living_room_5_71_termostat_override'',
      ''boost'') }}'
    turn_on:
    - action: velair.boost
      data:
        entity_id: climate.controller_living_room_5_71_termostat
        temperature: 24
        duration_minutes: 40
        hvac_mode: heat
    turn_off:
    - action: velair.cancel_boost
      data:
        entity_id: climate.controller_living_room_5_71_termostat
emulated_hue:
  entities:
    switch.living_room_boost:
      name: Living Room Boost
      hidden: false
