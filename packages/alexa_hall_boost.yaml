template:
- switch:
  - name: Hall Boost
    unique_id: hall_boost_alexa
    state: '{{ is_state(''sensor.spalnia_velair1_controller_hall_8_74_termostat_override'',
      ''boost'') }}'
    turn_on:
    - action: velair.boost
      data:
        entity_id: climate.controller_hall_8_74_termostat
        temperature: 26
        duration_minutes: 40
        hvac_mode: heat
    turn_off:
    - action: velair.cancel_boost
      data:
        entity_id: climate.controller_hall_8_74_termostat
emulated_hue:
  entities:
    switch.hall_boost:
      name: Hall Boost
      hidden: false
