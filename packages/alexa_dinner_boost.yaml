template:
  - switch:
      - name: Dinner Boost
        unique_id: dinner_boost_alexa
        state: "{{ is_state('sensor.spalnia_velair1_controller_diner_place_1_100_termostat_override', 'boost') }}"
        turn_on:
          - action: velair.boost
            data:
              entity_id: climate.controller_diner_place_1_100_termostat
              temperature: 25
              duration_minutes: 20
              hvac_mode: heat
        turn_off:
          - action: velair.cancel_boost
            data:
              entity_id: climate.controller_diner_place_1_100_termostat

emulated_hue:
  host_ip: 192.168.0.94
  listen_port: 80
  expose_by_default: false
  entities:
    switch.dinner_boost:
      name: Dinner Boost
      hidden: false
