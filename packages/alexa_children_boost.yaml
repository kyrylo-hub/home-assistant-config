template:
- switch:
  - name: Children Boost
    unique_id: children_boost_alexa
    state: '{{ is_state(''sensor.spalnia_velair1_controller_children_room_3_82_termostat_override'',
      ''boost'') }}'
    turn_on:
    - action: velair.boost
      data:
        entity_id: climate.controller_children_room_3_82_termostat
        temperature: 25
        duration_minutes: 40
        hvac_mode: heat
    turn_off:
    - action: velair.cancel_boost
      data:
        entity_id: climate.controller_children_room_3_82_termostat
emulated_hue:
  entities:
    switch.children_boost:
      name: Children Boost
      hidden: false
