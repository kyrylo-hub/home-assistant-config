template:
  - binary_sensor:
      - name: Children Velair manual mode
        unique_id: children_velair_manual_mode
        state: >
          {{
            is_state(
              'sensor.spalnia_velair1_controller_children_room_3_82_termostat_override',
              'paused'
            )
            and state_attr(
              'sensor.spalnia_velair1_controller_children_room_3_82_termostat_override',
              'pause_id'
            ) == 'velair.manual_adjustment'
          }}

      - name: Dinner Velair manual mode
